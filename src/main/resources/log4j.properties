log4j.rootLogger=INFO,logfile
log4j.appender.Encoding=UTF-8
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.err
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%p:%m%n

log4j.appender.logfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.logfile.File=${user.home}/.sqlc/logs/runtime.log
log4j.appender.logfile.Append=true
log4j.appender.logfile.Threshold=TRACE
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %p [%c{1}.%M:%L] %m%n
log4j.logger.com.zaxxer.hikari=FATAL